workflows:
  react-native-expo-android:
    name: AlWaleed Foundation Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20.x
      vars:
        XCODE_WORKSPACE: "ios/alwaleedfoundation.xcworkspace"
        XCODE_SCHEME: "alwaleedfoundation"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods (for iOS if needed later)
        script: |
          cd ios && pod install
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android
      - name: Build Android App (APK)
        script: |
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - almgawell17@gmail.com
